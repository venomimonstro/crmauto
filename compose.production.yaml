# Overlay for trusted TLS ingress. FRONTEND listens on loopback only;
# reverse proxy on host must terminate HTTPS and sanitize forwarded headers.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
  backend:
    restart: unless-stopped
  db:
    restart: unless-stopped
  redis:
    restart: unless-stopped
